[package]
name = "HackStorage"
version = "0.1.2"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
axum = "0.8.9"
axum-listener = "0.3.0"
clap = "4.6.1"
colored = "3.1.1"
dotenv = "0.15.0"
obfstr = "0.4.4"
ratatui = "0.30.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid", "rust_decimal"] }
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "ansi"] }
