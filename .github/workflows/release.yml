# Builds pentacore for every supported platform and publishes a GitHub release.
#
#   git tag v0.8.0 && git push origin v0.8.0     build and publish the release
#   Actions -> release -> Run workflow           build only, binaries as run artifacts
#
# Each target is built natively on its own runner, so the built binary can be
# started and checked before it is published. macOS x86_64 is not built: ONNX
# Runtime, which search by meaning links in, ships no binaries for it.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.95.0"

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, runner: macos-15 }
          - { target: x86_64-pc-windows-msvc, runner: windows-2025 }
          - { target: aarch64-pc-windows-msvc, runner: windows-11-arm }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          if ! command -v rustup >/dev/null; then
            curl -sSfL -o "$RUNNER_TEMP/rustup-init.exe" \
              "https://static.rust-lang.org/rustup/dist/${{ matrix.target }}/rustup-init.exe"
            "$RUNNER_TEMP/rustup-init.exe" -y --default-toolchain none --profile minimal
            echo "$USERPROFILE\\.cargo\\bin" >> "$GITHUB_PATH"
            export PATH="$(cygpath -u "$USERPROFILE")/.cargo/bin:$PATH"
          fi
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target ${{ matrix.target }}
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"

      # The OpenSSL that SQLCipher bundles is configured by a Perl script that
      # needs a full Perl; the one shipped with Git for Windows is not enough.
      - name: Use Strawberry Perl
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $perl = 'C:\Strawberry\perl\bin\perl.exe'
          if (-not (Test-Path $perl)) { choco install strawberryperl -y --no-progress }
          "OPENSSL_SRC_PERL=$perl" >> $env:GITHUB_ENV

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # Starts the server over stdio and expects an answer to `initialize`.
      # Proves the binary loads on a clean runner with no missing libraries.
      - name: Smoke test
        run: |
          bin="target/${{ matrix.target }}/release/pentacore"
          request='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"smoke","version":"0"}}}'
          reply=$(printf '%s\n' "$request" \
            | PENTACORE_HOME="$RUNNER_TEMP/pentacore-home" PENTACORE_PROJECT=smoke "$bin")
          echo "$reply" | grep -q '"serverInfo":{"name":"pentacore"'

      - name: Package
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          name="pentacore-$version-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp LICENSE README.md "dist/$name/"
          cp -R skills "dist/$name/"
          cp bin/.env.example "dist/$name/.env.example"
          cd dist
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "../target/${{ matrix.target }}/release/pentacore.exe" "$name/"
            powershell -NoProfile -Command "Compress-Archive -Path '$name' -DestinationPath '$name.zip'"
          else
            cp "../target/${{ matrix.target }}/release/pentacore" "$name/"
            tar -czf "$name.tar.gz" "$name"
          fi
          rm -rf "$name"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  sbom:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate CycloneDX SBOM
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          cargo +"$RUST_TOOLCHAIN" install cargo-cyclonedx --version 0.5.9 --locked
          cargo +"$RUST_TOOLCHAIN" cyclonedx --format json --target all --override-filename pentacore.cdx
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: pentacore.cdx.json
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, sbom]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
